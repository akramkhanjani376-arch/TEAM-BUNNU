<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team Bunny - Dashboard</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f4f6fb;
    padding-bottom:80px;
}

.header{
    background:linear-gradient(135deg,#6a11cb,#2575fc);
    color:white;
    padding:25px 20px 35px;
    border-radius:0 0 30px 30px;
}

.header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:42px;
}

.user{
    font-size:18px;
    font-weight:bold;
}

.card{
    width:calc(100% - 30px);
    max-width:600px;
    margin:-20px auto 20px;
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 8px 25px rgba(0,0,0,.1);
}

.points-title{
    color:#777;
    font-size:15px;
}

.points{
    font-size:42px;
    font-weight:bold;
    color:#6a11cb;
    margin-top:5px;
}

.grid{
    width:calc(100% - 30px);
    max-width:600px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.item{
    background:white;
    padding:22px 10px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
    font-weight:bold;
    color:#333;
}

.item-icon{
    font-size:32px;
    margin-bottom:8px;
}

.logout{
    background:#ffe5e5;
    color:#e74c3c;
}

.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:white;
    display:flex;
    justify-content:space-around;
    padding:12px 5px;
    box-shadow:0 -3px 15px rgba(0,0,0,.1);
}

.bottom button{
    border:0;
    background:none;
    font-size:12px;
    color:#666;
}

.bottom span{
    display:block;
    font-size:22px;
    margin-bottom:3px;
}

.loading{
    text-align:center;
    color:#777;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="header">

    <div class="header-top">

        <div>
            <div class="logo">🐰</div>
            <div class="user" id="username">
                Welcome
            </div>
        </div>

    </div>

</div>


<div class="card">

    <div class="points-title">
        Your Points
    </div>

    <div class="points" id="points">
        0
    </div>

    <div class="loading" id="loading">
        Loading...
    </div>

</div>


<div class="grid">

    <div class="item" onclick="location.href='invite.html'">
        <div class="item-icon">🎁</div>
        Invite
    </div>

    <div class="item" onclick="location.href='plans.html'">
        <div class="item-icon">📋</div>
        Plans
    </div>

    <div class="item" onclick="location.href='video.html'">
        <div class="item-icon">▶️</div>
        Watch Video
    </div>

    <div class="item" onclick="location.href='rewards.html'">
        <div class="item-icon">🏆</div>
        Rewards
    </div>

    <div class="item" onclick="location.href='profile.html'">
        <div class="item-icon">👤</div>
        Profile
    </div>

    <div class="item logout" onclick="logout()">
        <div class="item-icon">🚪</div>
        Logout
    </div>

</div>


<div class="bottom">

    <button onclick="location.href='dashboard.html'">
        <span>🏠</span>
        Home
    </button>

    <button onclick="location.href='invite.html'">
        <span>🎁</span>
        Invite
    </button>

    <button onclick="location.href='video.html'">
        <span>▶️</span>
        Video
    </button>

    <button onclick="location.href='profile.html'">
        <span>👤</span>
        Profile
    </button>

</div>


<script>

const username =
    localStorage.getItem("teamBunnyUsername");

if(!username){

    location.href = "index.html";

}


document.getElementById("username").textContent =
    "Welcome, " + username;


function loadUser(){

    fetch(
        "/api/user?username=" +
        encodeURIComponent(username)
    )

    .then(response => response.json())

    .then(data => {

        if(data.success){

            document.getElementById("points").textContent =
                data.points;

            localStorage.setItem(
                "teamBunnyPoints",
                data.points
            );

            localStorage.setItem(
                "teamBunnyEmail",
                data.email
            );

            document.getElementById("loading").textContent =
                "";

        }else{

            localStorage.clear();
            location.href = "index.html";

        }

    })

    .catch(error => {

        document.getElementById("loading").textContent =
            "Unable to connect to server.";

        console.log(error);

    });

}


function logout(){

    localStorage.removeItem("teamBunnyUsername");
    localStorage.removeItem("teamBunnyEmail");
    localStorage.removeItem("teamBunnyPoints");

    location.href = "index.html";

}


loadUser();

</script>

</body>
</html>

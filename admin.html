<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team Bunny - Screenshots</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6fb;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
}

.header{
    text-align:center;
    margin:20px 0;
}

.logo{
    font-size:60px;
}

h1{
    color:#6a11cb;
    margin:10px 0;
}

.subtitle{
    color:#777;
}

.card{
    background:white;
    padding:15px;
    border-radius:18px;
    margin:15px 0;
    box-shadow:0 6px 20px rgba(0,0,0,.08);
}

.card img{
    width:100%;
    max-height:500px;
    object-fit:contain;
    border-radius:12px;
    margin-top:10px;
    background:#eee;
}

.filename{
    color:#555;
    font-size:14px;
    word-break:break-all;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#6a11cb;
    color:white;
    font-size:17px;
    font-weight:bold;
    margin-top:10px;
}

.empty{
    text-align:center;
    color:#777;
    background:white;
    padding:25px;
    border-radius:18px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">🐰</div>

        <h1>Received Screenshots</h1>

        <p class="subtitle">
            Uploaded screenshots
        </p>

    </div>

    <button onclick="loadScreenshots()">
        Refresh
    </button>

    <div id="screenshots">
        Loading...
    </div>

</div>

<script>

function loadScreenshots(){

    const box =
        document.getElementById("screenshots");

    box.innerHTML = "Loading...";

    fetch("/api/screenshots")

    .then(response => response.json())

    .then(data => {

        if(!data.success){

            box.innerHTML =
                "<div class='empty'>Unable to load screenshots.</div>";

            return;
        }

        if(data.files.length === 0){

            box.innerHTML =
                "<div class='empty'>No screenshots received yet.</div>";

            return;
        }

        box.innerHTML = "";

        data.files.reverse().forEach(file => {

            const card =
                document.createElement("div");

            card.className = "card";

            card.innerHTML = `
                <div class="filename">
                    ${file.filename}
                </div>

                <img
                    src="${file.url}"
                    alt="Uploaded Screenshot"
                >
            `;

            box.appendChild(card);

        });

    })

    .catch(error => {

        box.innerHTML =
            "<div class='empty'>Server connection failed.</div>";

        console.log(error);

    });
}

loadScreenshots();

</script>

</body>
</html>

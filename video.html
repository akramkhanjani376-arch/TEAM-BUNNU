<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team Bunny - Watch Video</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f4f6fb;
    padding:20px;
}

.box{
    width:100%;
    max-width:550px;
    margin:30px auto;
    background:white;
    padding:25px 20px;
    border-radius:25px;
    box-shadow:0 8px 25px rgba(0,0,0,.1);
    text-align:center;
}

.logo{
    font-size:60px;
}

h1{
    color:#6a11cb;
    margin:10px 0;
}

.subtitle{
    color:#777;
    margin-bottom:20px;
}

.video-box{
    width:100%;
    height:250px;
    background:#222;
    border-radius:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:50px;
    margin:20px 0;
}

.points{
    font-size:20px;
    font-weight:bold;
    color:#2575fc;
    margin:15px 0;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#6a11cb;
    color:white;
    font-size:17px;
    font-weight:bold;
    margin-top:10px;
}

button:disabled{
    background:#aaa;
}

.back{
    background:#2575fc;
}

.message{
    min-height:24px;
    margin-top:15px;
    color:#27ae60;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">🐰</div>

    <h1>Watch Video</h1>

    <p class="subtitle">
        Watch the video and claim your points
    </p>

    <div class="video-box">
        ▶️
    </div>

    <div class="points">
        Reward: +20 Points
    </div>

    <button id="claimButton" onclick="claimReward()">
        Claim 20 Points
    </button>

    <div class="message" id="message"></div>

    <button class="back"
            onclick="location.href='dashboard.html'">
        Back to Dashboard
    </button>

</div>


<script>

const username =
    localStorage.getItem("teamBunnyUsername");

if(!username){

    location.href = "index.html";

}


function claimReward(){

    const button =
        document.getElementById("claimButton");

    const message =
        document.getElementById("message");

    button.disabled = true;

    button.textContent =
        "Processing...";

    message.textContent = "";


    fetch("/api/video-reward",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            username:username
        })

    })

    .then(response => response.json())

    .then(data => {

        if(data.success){

            localStorage.setItem(
                "teamBunnyPoints",
                data.points
            );

            message.textContent =
                "20 points added! Total: " +
                data.points;

            button.textContent =
                "Reward Claimed";

        }else{

            message.textContent =
                data.message;

            button.disabled = false;

            button.textContent =
                "Claim 20 Points";

        }

    })

    .catch(error => {

        message.textContent =
            "Server connection failed.";

        button.disabled = false;

        button.textContent =
            "Claim 20 Points";

        console.log(error);

    });

}

</script>

</body>
</html>
